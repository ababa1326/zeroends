<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#faf7f2"/>
  <rect x="0" y="0" width="1200" height="10" fill="#4a3b8a"/>

  <!-- brand mark -->
  <g transform="translate(80,84)">
    <rect width="46" height="46" rx="10" fill="#4a3b8a"/>
    <circle cx="23" cy="23" r="12" fill="none" stroke="#faf7f2" stroke-width="4.5"/>
    <path d="M23 11 A12 12 0 0 1 35 23" fill="none" stroke="#c4622d" stroke-width="4.5" stroke-linecap="round"/>
    <text x="62" y="32" font-size="25" letter-spacing="3" font-family="ui-monospace, 'Cascadia Code', Menlo, monospace" fill="#8a7f72" font-weight="600">ZERO<tspan fill="#14110f">ENDS</tspan></text>
  </g>

  <!-- eyebrow -->
  <text x="80" y="232" font-size="24" letter-spacing="5" font-family="ui-monospace, 'Cascadia Code', Menlo, monospace" fill="#4a3b8a" font-weight="600">PROMO DEADLINE · NOT A SUGGESTION</text>

  <!-- headline -->
  <text x="78" y="318" font-size="72" font-weight="700" fill="#14110f" letter-spacing="-1.5">Your 0% APR has an</text>
  <text x="78" y="400" font-size="72" font-weight="700" letter-spacing="-1.5"><tspan fill="#4a3b8a">expiration date.</tspan></text>

  <!-- subtext -->
  <text x="80" y="468" font-size="29" fill="#4a443c">See exactly what to pay each month so your balance hits $0</text>
  <text x="80" y="506" font-size="29" fill="#4a443c">before the promo ends — and what the cliff costs if you miss.</text>

  <!-- pace bar motif -->
  <g transform="translate(80,548)">
    <rect width="1040" height="14" rx="7" fill="#ded5c7"/>
    <rect width="624" height="14" rx="7" fill="#4a3b8a"/>
    <rect x="1037" y="-5" width="3" height="24" fill="#14110f"/>
    <text x="1020" y="40" font-size="15" font-family="ui-monospace, monospace" fill="#8a7f72" text-anchor="end">$0 by the deadline</text>
  </g>
</svg>
